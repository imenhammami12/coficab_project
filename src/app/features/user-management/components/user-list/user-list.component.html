<app-user-form></app-user-form>

<div class="card">
  <h2 class="page-title">Gestion des utilisateurs</h2>

  <table class="user-table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Rôle</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.firstName }} {{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge">{{ user.role }}</span></td>
          <td>
            <span [class]="user.isActive ? 'status-active' : 'status-inactive'">
              {{ user.isActive ? 'Actif' : 'Inactif' }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="btn-secondary" (click)="onEdit(user)">Modifier</button>
            <button class="btn-primary" (click)="onDelete(user.id)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<app-user-edit [user]="selectedUser" (close)="onCloseEdit()"></app-user-edit>
