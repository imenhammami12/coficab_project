<div class="page-header">
  <h2 class="page-title">Gestion des utilisateurs</h2>
  <button class="btn-primary" (click)="onOpenAddForm()">+ Ajouter un utilisateur</button>
</div>

<div class="card">
  <table class="user-table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Rôle</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>
            <div class="user-cell">
              <div class="avatar">{{ user.firstName[0] }}{{ user.lastName[0] }}</div>
              <span>{{ user.firstName }} {{ user.lastName }}</span>
            </div>
          </td>
          <td>{{ user.email }}</td>
          <td><span class="badge" [class]="'badge-' + user.role">{{ user.role }}</span></td>
          <td>
            <span [class]="user.isActive ? 'status-active' : 'status-inactive'">
              {{ user.isActive ? 'Actif' : 'Inactif' }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="btn-secondary" (click)="onEdit(user)">Modifier</button>
            <button class="btn-danger" (click)="onDelete(user.id)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showAddForm()) {
  <div class="modal-backdrop" (click)="onCloseAddForm()">
    <div (click)="$event.stopPropagation()">
      <app-user-form (userAdded)="onCloseAddForm()"></app-user-form>
    </div>
  </div>
}

<app-user-edit [user]="selectedUser" (close)="onCloseEdit()"></app-user-edit>
