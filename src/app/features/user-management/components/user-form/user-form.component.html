<form [formGroup]="form" (ngSubmit)="onSubmit()" class="card user-form">
  <h3 class="form-title">Ajouter un utilisateur</h3>

  <div class="form-row">
    <label for="firstName">Prénom</label>
    <input id="firstName" type="text" formControlName="firstName" />
    @if (form.get('firstName')?.invalid && form.get('firstName')?.touched) {
      <span class="error">Le prénom est requis</span>
    }
  </div>

  <div class="form-row">
    <label for="lastName">Nom</label>
    <input id="lastName" type="text" formControlName="lastName" />
    @if (form.get('lastName')?.invalid && form.get('lastName')?.touched) {
      <span class="error">Le nom est requis</span>
    }
  </div>

  <div class="form-row">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <span class="error">Email invalide</span>
    }
  </div>

  <div class="form-row">
    <label for="role">Rôle</label>
    <select id="role" formControlName="role">
      <option value="user">Utilisateur</option>
      <option value="manager">Manager</option>
      <option value="admin">Admin</option>
    </select>
  </div>

  <button type="submit" class="btn-primary">Ajouter</button>
</form>
